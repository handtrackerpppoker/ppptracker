  <style>
    .page-back {
      display:inline-flex; align-items:center; gap:6px; color:var(--muted);
      font-family:var(--font-head); font-size:.78rem; font-weight:600;
      letter-spacing:.4px; text-decoration:none; padding:4px 0; transition:color .15s;
    }
    .page-back:hover { color:var(--green); }
    .page-title {
      font-family:var(--font-head); font-size:clamp(.95rem,3.5vw,1.4rem);
      font-weight:800; color:var(--green);
    }
    .lk-meta  { color:var(--muted); font-size:.85rem; }
    .lk-pos-card { cursor:pointer; }
    .lk-pos-head {
      display:flex; align-items:center; gap:14px; flex-wrap:wrap;
      padding:14px 18px;
    }
    .lk-pos-name {
      font-family:var(--font-head); font-weight:800; font-size:1.15rem;

    }
    .lk-pos-kv   { color:var(--muted); font-size:.85rem; }

    .lk-wr-pos   { color:var(--green) !important; }
    .lk-wr-neg   { color:#ff5470 !important; }
    .lk-pills { margin-left:auto; display:flex; gap:6px; flex-wrap:nowrap; align-items:center; }
    .lk-pill {
      font-family:var(--font-head); font-size:.72rem; font-weight:700;
      border-radius:20px; padding:2px 10px; letter-spacing:.4px; white-space:nowrap;

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script>
const POS_ORDER = ['BTN', 'CO', 'MP', 'EP', 'BB', 'SB'];
const STREETS = ['Preflop', 'Flop', 'Turn', 'River'];
// How many opportunities a stat needs before its verdict is colored rather
// than shown as 'neh'. The server sends every row ungated (classify with
// min_sample=0) and we apply the gate here, so moving the Confidence control
// re-grades the page instantly — no refetch, no cache rebuild.
let CONFIDENCE = { low: 3, med: 5, high: 10 };   // overwritten from meta
const CONF_ORDER = ['low', 'med', 'high'];
let CONF_LEVEL = 'med';
try { CONF_LEVEL = localStorage.getItem('lk_confidence') || 'med'; } catch (_) {}
if (!CONF_ORDER.includes(CONF_LEVEL)) CONF_LEVEL = 'med';
let MIN_SAMPLE = CONFIDENCE[CONF_LEVEL];

// Effective-stack depth band. Unlike Confidence (a client-side re-grade), a
// depth change re-fetches: the server slices the report to that band. 'all' is
// the position total. BAND_META is the {key,label,hands} list from meta.bands.
let BAND = 'all';
try { BAND = localStorage.getItem('lk_band') || 'all'; } catch (_) {}
let BAND_META = [];
let REPORT_DATA = null;       // {position: rowsArray} kept so sorting never re-fetches
const SORT_STATE = {};        // {position: 'asc'|'desc'|null}
const SORT_HANDS_STATE = {};  // {position: 'asc'|'desc'|null}

// What each stat measures, keyed by the report label. Written from the engine's
// own validated definitions (leak_engine.preflop/postflop_stat_flags).
const STAT_HELP = {
  'Raise First': 'Raised when first to enter the pot — no limpers or raises ahead.',
  'Limp Open': 'Just called the big blind when first to enter the pot.',
  'Limp/Raise': 'Limped in first, then raised when someone raised behind you.',
  'Limp/Call': 'Limped in first, then called a raise behind you.',
  'Limp/Fold': 'Limped in first, then folded to a raise behind you.',
  'Raise SB Open Limp': 'In the big blind, raised when only the small blind limped in.',
  'Fold BB v SB': 'In the big blind, folded to a small-blind open raise.',
  'Fold to Steal': 'In the blinds, folded to a steal attempt from CO, button or small blind.',
  'Call PF 2Bet': 'Called a single preflop raise.',
  '3Bet PF': 'Re-raised (3-bet) when facing a single preflop raise.',
  '3Bet Steal': 'In the blinds, 3-bet a steal attempt rather than folding or calling.',
  '3Bet NAI <35': '3-bet preflop without shoving, holding 35 big blinds or fewer.',
  '2Bet PF & Fold': 'Opened the pot, then folded when facing a 3-bet.',
  'Raise & 4Bet+ PF': 'Opened the pot, then 4-bet when facing a 3-bet.',
  '3Bet PF & Fold': '3-bet preflop, then folded when facing a 4-bet.',
  'Fold to PF 4Bet After 3Bet <30': '3-bet then folded to a 4-bet, holding 30 big blinds or fewer.',
  'PF Squeeze': 'Re-raised facing a raise plus at least one caller.',
  'CBet F OOP (HU)': 'As preflop raiser out of position, bet the flop heads-up.',
  'CBet F IP (HU)': 'As preflop raiser in position, bet the flop heads-up.',
  'Float F HU': 'Called one preflop raise in position, then bet the flop when checked to.',
  'Fold to F Cbet (HU)': "Folded to the preflop raiser's flop bet, heads-up.",
  'Fold to F CBet (3B)': 'Folded to a flop continuation bet in a 3-bet or bigger pot.',
  'Fold to F Float HU': 'As uncontested preflop raiser, checked the flop then folded to a bet.',
  'CBet F & Fold (HU)': 'Continuation bet the flop, then folded to a raise, heads-up.',
  'Raise F CBet (HU)': "Raised the preflop raiser's flop continuation bet, heads-up.",
  'XR Flop HU': 'Checked and then raised on the flop, heads-up.',
  'Raise F CBet (3B)': 'Raised a flop continuation bet in a 3-bet or bigger pot.',
  'Donk T (HU)': 'Bet the turn before the flop aggressor got to act, heads-up.',
  'CBet T (HU)': 'Kept betting the turn after continuation betting the flop, heads-up.',
  'Float T': 'Called a flop bet in position, then bet the turn when checked to.',
  'Probe T (HU)': 'Bet the turn out of position after the preflop raiser checked back the flop.',
  'Probe T HU & Bet R': 'After probing the turn heads-up, also bet the river.',
  'Fold to T CBet': "Folded to the flop continuation bettor's turn bet.",
  'F to T Pr (HU)': 'Had the flop c-bet chance, checked, then folded to a turn probe bet.',
  'Raise T CBet': "Raised the flop continuation bettor's turn bet.",
  'Raise T Probe (HU)': 'Raised a turn probe bet, heads-up.',
  'Donk R': 'Bet the river before the turn aggressor got to act.',
  'CBet R': 'Kept betting the river after continuation betting the turn.',
  'Fold to R CBet': "Folded to the turn continuation bettor's river bet.",
};

function fmtPct(v) { return v == null ? '—' : v.toFixed(2).replace(/\.?0+$/, '') + '%'; }
function fmtBB(v)  { return v == null ? '—' : (v >= 0 ? '+' : '') + Math.round(v) + 'bb'; }
function esc(s) { return String(s).replace(/"/g, '&quot;'); }

// Severity tiers by |delta| (distance from the target band, in band-widths).
// 'good' is inside the band; beyond it the gap grades low -> mid -> high the
// same way whether you're under or over target.
const TIERS = {
  good: { label: 'good', color: '#00e676' },
  low:  { label: 'low',  color: '#9ccc3c' },
  mid:  { label: 'mid',  color: '#f0c33c' },
  high: { label: 'high', color: '#ff5470' },
};

function tierOf(s) {
  if (s.result === 'INSUFFICIENT') return 'neh';   // pre-gated payloads
  // Order matters: a row with no target has no verdict to suppress, so it
  // stays null ("No target yet") rather than being mislabelled 'neh'.
  if (!s.result) return null;
  if (s.opp != null && s.opp < MIN_SAMPLE) return 'neh';
  if (s.result === 'GOOD') return 'good';
  const d = Math.abs(s.delta ?? 0);
  return d <= 0.5 ? 'low' : d <= 1.5 ? 'mid' : 'high';
}

// Ranks drive both display and sorting: good(0) low(1) mid(2) high(3), then
// the "nothing to say" tail — neh(4), no target(5), no samples(6) — which is
// pinned to the bottom in BOTH sort directions.
function rankOf(s) {
  const tier = tierOf(s);
  if (tier === 'good') return 0;
  if (tier === 'low')  return 1;
  if (tier === 'mid')  return 2;
  if (tier === 'high') return 3;
  if (tier === 'neh')  return 4;
  return s.opp ? 5 : 6;
}

function resultBadge(s) {
  const tier = tierOf(s);
  if (tier === 'neh') {
    return `<span class="lk-badge neh" title="Only ${s.opp} opportunit${s.opp === 1 ? 'y' : 'ies'} — not enough hands for a verdict">neh</span>`;
  }
  if (!tier) return '<span class="lk-count">—</span>';
  const { label, color } = TIERS[tier];
  const dir = s.result === 'LOW' ? 'below' : s.result === 'HIGH' ? 'above' : null;
  const title = tier === 'good'
    ? 'Inside the target range'
    : `${Math.abs(s.delta).toFixed(2)} target-band widths ${dir} the range`;
  return `<span class="lk-badge" style="background:${color}1f;color:${color};border:1px solid ${color}66" title="${esc(title)}">${label}</span>`;
}

function sortedRows(rows, dir) {
  if (!dir) return rows;
  return rows.slice().sort((a, b) => {
    const ra = rankOf(a), rb = rankOf(b);
    const tailA = ra >= 4, tailB = rb >= 4;
    if (tailA !== tailB) return tailA ? 1 : -1;   // tail always last
    if (tailA) return ra - rb;                    // stable order within the tail
    if (ra !== rb) return dir === 'asc' ? ra - rb : rb - ra;
    const da = Math.abs(a.delta ?? 0), db = Math.abs(b.delta ?? 0);
    return dir === 'asc' ? da - db : db - da;
  });
}

function recColor(s) {
  const tier = tierOf(s);
  if (!tier || tier === 'neh') return '';
  return TIERS[tier].color;
}

function directedRec(storedRec, result) {
  if (!storedRec) return result === 'LOW' ? 'More' : 'Less';
  if (/^avoid/i.test(storedRec)) return storedRec;
  if (result === 'HIGH' && /\bmore\b/i.test(storedRec))
    return storedRec.replace(/\bmore\b/gi, '{{L}}').replace(/\{\{L\}\}/g, 'less');
  if (result === 'LOW' && /\bless\b/i.test(storedRec))
    return storedRec.replace(/\bless\b/gi, '{{M}}').replace(/\{\{M\}\}/g, 'more');
  return storedRec;
}

let COL_ORDER = [0, 1, 2, 3, 4];
let COL_ORDER_CMP = [0, 1, 2, 3, 4, 5];

function headerCells(pos) {
  const h = [
    `<th data-col="0" draggable="true" class="lk-sortable lk-col-name" onclick="cycleSortHands('${pos}')" title="Sort by number of hands">Name (hands) <span class="lk-sort-arrow" data-sort-arrow-hands="${pos}"></span></th>`,
    '<th data-col="1" draggable="true" class="text-end lk-col-num">Hero</th>',
    '<th data-col="2" draggable="true" class="text-end lk-col-target">Target</th>',
    `<th data-col="3" draggable="true" class="text-center lk-sortable lk-col-result" onclick="cycleSort('${pos}')" title="Sort by distance from target">Result <span class="lk-sort-arrow" data-sort-arrow="${pos}"></span></th>`,
    '<th data-col="4" draggable="true" class="lk-col-action">Action</th>',
  ];
  return COL_ORDER.map(i => h[i]).join('');
}

function headerCellsCmp(pos) {
  const h = [
    `<th data-col="0" draggable="true" class="lk-sortable lk-col-name" onclick="cycleSortHands('${pos}')" title="Sort by number of hands">Name (hands) <span class="lk-sort-arrow" data-sort-arrow-hands="${pos}"></span></th>`,
    '<th data-col="1" draggable="true" class="text-end lk-col-num">Hero A</th>',
    '<th data-col="2" draggable="true" class="text-end lk-col-num">Hero B</th>',
    '<th data-col="3" draggable="true" class="text-end lk-col-target">Target</th>',
    `<th data-col="4" draggable="true" class="text-center lk-sortable lk-col-result" onclick="cycleSortCompare('${pos}')" title="Sort by change between the two ranges">Progress <span class="lk-sort-arrow" data-sort-arrow="${pos}"></span></th>`,
    '<th data-col="5" draggable="true" class="lk-col-action">Action</th>',
  ];
  return COL_ORDER_CMP.map(i => h[i]).join('');
}

let _dragCol = null;
let _dragMode = null;
document.addEventListener('DOMContentLoaded', () => {
  const cards = document.getElementById('lk-cards');
  cards.addEventListener('dragstart', e => {
    const th = e.target.closest('th[data-col]');
    if (!th) return;
    _dragCol = +th.dataset.col;
    _dragMode = COMPARE_MODE ? 'cmp' : 'std';
    th.style.opacity = '.4';
    e.dataTransfer.effectAllowed = 'move';
  });
  cards.addEventListener('dragend', e => {
    const th = e.target.closest('th[data-col]');
    if (th) th.style.opacity = '';
    cards.querySelectorAll('.lk-drag-over').forEach(el => el.classList.remove('lk-drag-over'));
  });
  cards.addEventListener('dragover', e => {
    const th = e.target.closest('th[data-col]');
    if (th && _dragCol !== null) { e.preventDefault(); th.classList.add('lk-drag-over'); }
  });
  cards.addEventListener('dragleave', e => {
    const th = e.target.closest('th[data-col]');
    if (th) th.classList.remove('lk-drag-over');
  });
  cards.addEventListener('drop', e => {
    const th = e.target.closest('th[data-col]');
    if (!th || _dragCol === null) return;
    e.preventDefault();
    th.classList.remove('lk-drag-over');
    const dropCol = +th.dataset.col;
    if (_dragCol === dropCol) { _dragCol = null; return; }
    const order = _dragMode === 'cmp' ? COL_ORDER_CMP : COL_ORDER;
    const from = order.indexOf(_dragCol), to = order.indexOf(dropCol);
    order.splice(from, 1);
    order.splice(to, 0, _dragCol);
    _dragCol = null;
    reRenderAllTables();
  });
});

function reRenderAllTables() {
  const data = COMPARE_MODE ? COMPARE_DATA : REPORT_DATA;
  if (!data) return;
  const renderer = COMPARE_MODE ? renderRowsCompare : renderRows;
  const hdr = COMPARE_MODE ? headerCellsCmp : headerCells;
  Object.keys(data).forEach(pos => {
    const tbody = document.querySelector(`tbody[data-position="${pos}"]`);
    if (tbody) tbody.innerHTML = renderer(pos);
    const thead = tbody && tbody.closest('table') && tbody.closest('table').querySelector('thead tr');
    if (thead) thead.innerHTML = hdr(pos);
  });
}

function rowHtml(s, showStreet) {
  const isThin = tierOf(s) === 'neh';
  const isNA = s.target === null && s.rec === 'Not applicable';
  const rec = isNA ? 'Not applicable'
    : isThin ? `Need ${MIN_SAMPLE}+ hands`
    : !s.result ? (s.opp ? 'No target yet' : '')
    : s.result === 'GOOD' ? 'Good job' : directedRec(s.rec, s.result);
  const targetCell = isNA ? '<span class="lk-count">n/a</span>'
    : s.target ? s.target[0] + '% – ' + s.target[1] + '%' : '—';
  const help = STAT_HELP[s.label] || '';
  const rc = recColor(s);
  const recStyle = rc ? ` style="color:${rc}"` : '';
  const recClass = rc ? '' : 'lk-rec-thin';
  const heroStyle = rc ? ` style="color:${rc}"` : '';
  const cells = [
    `<td data-col="0"><span class="lk-stat-name" data-tip="${esc(help)}">${s.label}</span> <span class="lk-count">(${s.opp})</span>${showStreet ? ` <span class="lk-street-inline">${s.street}</span>` : ''}</td>`,
    `<td data-col="1" class="text-end"${heroStyle}>${fmtPct(s.pct)}</td>`,
    `<td data-col="2" class="text-end">${targetCell}</td>`,
    `<td data-col="3" class="text-center">${isNA ? '<span class="lk-count">—</span>' : resultBadge(s)}</td>`,
    `<td data-col="4" class="${recClass}"${recStyle}>${rec}</td>`,
  ];
  return `<tr>${COL_ORDER.map(i => cells[i]).join('')}</tr>`;
}

function renderRows(position) {
  const dir = SORT_STATE[position];
  const hdir = SORT_HANDS_STATE[position];
  let rows = REPORT_DATA[position].filter(s => filterRow(s, position));
  if (hdir) return sortedByHands(rows, hdir).map(s => rowHtml(s, true)).join('');
  if (!dir) {
    return STREETS.map(street => {
      const group = rows.filter(s => s.street === street);
      if (!group.length) return '';
      return `<tr class="lk-street-row"><td colspan="5">${street}</td></tr>`
        + group.map(s => rowHtml(s, false)).join('');
    }).join('');
  }
  return sortedRows(rows, dir).map(s => rowHtml(s, true)).join('');
}

function sortArrow(position) {
  const dir = SORT_STATE[position];
  return dir === 'asc' ? '▲' : dir === 'desc' ? '▼' : '';
}

function cycleSort(position) {
  const cur = SORT_STATE[position];
  SORT_STATE[position] = cur === null ? 'asc' : cur === 'asc' ? 'desc' : null;
  SORT_HANDS_STATE[position] = null;
  document.querySelector(`tbody[data-position="${position}"]`).innerHTML = renderRows(position);
  const arrow = document.querySelector(`[data-sort-arrow="${position}"]`);
  if (arrow) arrow.textContent = sortArrow(position);
  const harrow = document.querySelector(`[data-sort-arrow-hands="${position}"]`);
  if (harrow) harrow.textContent = '';
}

function sortedByHands(rows, dir) {
  if (!dir) return rows;
  return rows.slice().sort((a, b) => {
    return dir === 'asc' ? (a.opp || 0) - (b.opp || 0) : (b.opp || 0) - (a.opp || 0);
  });
}

function cycleSortHands(position) {
  const cur = SORT_HANDS_STATE[position];
  SORT_HANDS_STATE[position] = cur === null ? 'desc' : cur === 'desc' ? 'asc' : null;
  SORT_STATE[position] = null;
  const renderer = COMPARE_MODE ? renderRowsCompare : renderRows;
  document.querySelector(`tbody[data-position="${position}"]`).innerHTML = renderer(position);
  const harrow = document.querySelector(`[data-sort-arrow-hands="${position}"]`);
  if (harrow) harrow.textContent = SORT_HANDS_STATE[position] === 'asc' ? '▲' : SORT_HANDS_STATE[position] === 'desc' ? '▼' : '';
  const arrow = document.querySelector(`[data-sort-arrow="${position}"]`);
  if (arrow) arrow.textContent = '';
}

// ── Filters ────────────────────────────────────────────────────────────────
// Filters select whole tournaments, never partial ones: a session that runs
// past midnight stays intact instead of being cut in half by a date bound.
//
// Two independent filter bars can exist: '' (Range A, always present) and
// 'b' (Range B, only when Compare is on). Both read the same `filters`
// payload (the server returns it unconditionally, computed over every saved
// tournament) — only the DOM checkbox/date state differs between them, so a
// single `ns` argument threading through these functions is enough; there is
// no need to fetch or store the room list twice.
// [{key,label,is_mtt,tournaments,hands}] — real-money MTTs only. The API's
// is_mtt here is the classify_game verdict, not PPPoker's raw room.mtt flag,
// so play-money MTTs arrive as is_mtt=false and land in the disabled section.
let ROOMS = [];
let LAST_FILTERS = null;
const FILTERS_BUILT = {};      // {ns: true} once that bar's DOM has been built
let AUTH_USER = null;
let COMPARE_MODE = false;
let COMPARE_SEEDED = false;
let COMPARE_DATA = {};         // {position: combinedRowsArray} — parallel to REPORT_DATA
let HIDE_NEH = true;
const POS_FILTERS = {};

function defaultPosFilter() { return {good: true, bad: true, neh: !HIDE_NEH}; }

function isNA(s) { return s.target === null && s.rec === 'Not applicable'; }

function filterRow(s, pos) {
  if (isNA(s)) return false;
  const f = POS_FILTERS[pos] || defaultPosFilter();
  const tier = tierOf(s);
  if (tier === 'neh') return f.neh;
  if (tier === 'good') return f.good;
  if (tier !== null) return f.bad;
  return true;
}

// Only 'good' and 'bad' reach here — the "All" pill is the global neh toggle
// (onHideNehToggle), not a per-position reset.
function togglePosFilter(pos, cat, evt) {
  evt.stopPropagation();
  if (!POS_FILTERS[pos]) POS_FILTERS[pos] = defaultPosFilter();
  const f = POS_FILTERS[pos];
  f[cat] = !f[cat];
  const tbody = document.querySelector(`tbody[data-position="${pos}"]`);
  if (tbody) tbody.innerHTML = renderRows(pos);
  const card = document.querySelector(`[data-pos-card="${pos}"]`);
  if (!card) return;
  card.querySelector('.lk-pill.good').classList.toggle('inactive', !f.good);
  card.querySelector('.lk-pill.bad').classList.toggle('inactive', !f.bad);
}

function barId(ns, suffix) { return ns ? `lk-${ns}-${suffix}` : `lk-${suffix}`; }

function filterBarSkeleton(ns) {
  const heading = ns === 'b' ? `<div class="lk-compare-label">Compare against</div>` : '';
  return `${heading}
    <div class="lk-filter-row">
      <button class="lk-filter-btn" id="${barId(ns, 'rooms-btn')}" onclick="toggleRoomPanel('${ns}')">
        Tournaments: <b id="${barId(ns, 'rooms-label')}">All</b> <span style="opacity:.6">▾</span>
      </button>
      <span class="lk-dates">
        <label class="lk-date-lbl">From <input type="date" id="${barId(ns, 'from')}" class="lk-date"></label>
        <label class="lk-date-lbl">To <input type="date" id="${barId(ns, 'to')}" class="lk-date"></label>
      </span>
    </div>
    <div id="${barId(ns, 'room-panel')}" class="lk-room-panel d-none">
      <div class="lk-room-actions">
        <a href="#" onclick="selectRooms('${ns}', true);return false">Select all</a> ·
        <a href="#" onclick="selectRooms('${ns}', false);return false">Clear</a>
      </div>
      <div id="${barId(ns, 'room-list')}" class="lk-room-list"></div>
      <div id="${barId(ns, 'cash-section')}" class="lk-cash-section d-none">
        <div class="lk-cash-note">Leak Finder evaluates real-money tournaments only — cash-game and play-money hands aren't included.</div>
        <div id="${barId(ns, 'room-list-cash')}" class="lk-room-list"></div>
      </div>
    </div>`;
}

function createActionButtons() {
  const div = document.createElement('div');
  div.id = 'lk-actions';
  div.className = 'lk-filter-row';
  div.style.borderTop = '1px solid #ffffff14';
  div.innerHTML = `
    <button class="lk-apply" onclick="applyFilters()">Apply</button>
    <button class="lk-reset" onclick="resetFilters()">Reset</button>
    <label class="lk-compare-toggle">
      <input type="checkbox" id="lk-compare-toggle" onchange="onCompareToggle(this.checked)"> Compare
    </label>`;
  return div;
}

function placeActionButtons(barNs) {
  let el = document.getElementById('lk-actions');
  if (!el) el = createActionButtons();
  document.getElementById(barId(barNs, 'filterbar')).appendChild(el);
}

function roomItemHtml(ns, r, disabled) {
  return `
    <label class="lk-room-item${disabled ? ' disabled' : ''}" title="${esc(r.label)}">
      <input type="checkbox" value="${esc(r.key)}" ${disabled ? 'disabled' : 'checked'}
             onchange="updateRoomsLabel('${ns}')">
      <span>${r.label}</span><span class="n">${r.hands}</span>
    </label>`;
}

function toggleRoomPanel(ns) {
  document.getElementById(barId(ns, 'room-panel')).classList.toggle('d-none');
}

function selectedRooms(ns) {
  return Array.from(document.querySelectorAll(`#${barId(ns, 'room-list')} input:checked`))
              .map(el => el.value);
}

function selectRooms(ns, on) {
  document.querySelectorAll(`#${barId(ns, 'room-list')} input`).forEach(el => { el.checked = on; });
  updateRoomsLabel(ns);
}

function updateRoomsLabel(ns) {
  const sel = selectedRooms(ns);
  const el = document.getElementById(barId(ns, 'rooms-label'));
  el.textContent = (sel.length === 0 || sel.length === ROOMS.length)
    ? `All (${ROOMS.length})` : `${sel.length} of ${ROOMS.length}`;
}

function populateFilterBar(ns, filters) {
  ROOMS = (filters.rooms || []).filter(r => r.is_mtt);
  const cash = (filters.rooms || []).filter(r => !r.is_mtt);
  document.getElementById(barId(ns, 'room-list')).innerHTML =
    ROOMS.map(r => roomItemHtml(ns, r, false)).join('');
  const cashSection = document.getElementById(barId(ns, 'cash-section'));
  if (cash.length) {
    document.getElementById(barId(ns, 'room-list-cash')).innerHTML =
      cash.map(r => roomItemHtml(ns, r, true)).join('');
    cashSection.classList.remove('d-none');
  } else {
    cashSection.classList.add('d-none');
  }
  const from = document.getElementById(barId(ns, 'from')), to = document.getElementById(barId(ns, 'to'));
  if (filters.date_min) { from.min = to.min = filters.date_min; }
  if (filters.date_max) { from.max = to.max = filters.date_max; }
  updateRoomsLabel(ns);
}

function ensureFilterBar(ns) {
  if (FILTERS_BUILT[ns] || !LAST_FILTERS) return;
  document.getElementById(barId(ns, 'filterbar')).innerHTML = filterBarSkeleton(ns);
  populateFilterBar(ns, LAST_FILTERS);
  FILTERS_BUILT[ns] = true;
  if (ns === '') placeActionButtons('');
}

function copyFilterState(fromNs, toNs) {
  const sel = selectedRooms(fromNs);
  document.querySelectorAll(`#${barId(toNs, 'room-list')} input`).forEach(el => {
    el.checked = sel.length === 0 || sel.includes(el.value);
  });
  document.getElementById(barId(toNs, 'from')).value = document.getElementById(barId(fromNs, 'from')).value;
  document.getElementById(barId(toNs, 'to')).value = document.getElementById(barId(fromNs, 'to')).value;
  updateRoomsLabel(toNs);
}

function onCompareToggle(checked) {
  COMPARE_MODE = checked;
  ensureFilterBar('b');
  document.getElementById(barId('b', 'filterbar')).classList.toggle('d-none', !checked);
  placeActionButtons(checked ? 'b' : '');
  if (checked && !COMPARE_SEEDED) {
    copyFilterState('', 'b');
    COMPARE_SEEDED = true;
  }
}

// Driven from two places — the status-row pill and every position's "All"
// pill — so it owns re-syncing both, plus the tallies that count only what
// is on screen.
function onHideNehToggle() {
  HIDE_NEH = !HIDE_NEH;
  const pill = document.getElementById('lk-neh-pill');
  if (pill) { pill.classList.toggle('inactive', !HIDE_NEH); pill.textContent = HIDE_NEH ? 'Show neh' : 'Hide neh'; }
  const data = COMPARE_MODE ? COMPARE_DATA : REPORT_DATA;
  if (!data) return;
  const renderer = COMPARE_MODE ? renderRowsCompare : renderRows;
  Object.keys(data).forEach(pos => {
    if (POS_FILTERS[pos]) POS_FILTERS[pos].neh = !HIDE_NEH;
    const tbody = document.querySelector(`tbody[data-position="${pos}"]`);
    if (tbody) tbody.innerHTML = renderer(pos);
  });
  if (!COMPARE_MODE) refreshPosPillCounts();
}

function currentQuery(ns) {
  const params = new URLSearchParams();
  const sel = selectedRooms(ns);
  // Sending every room is the same as sending none; keep the URL short.
  if (sel.length && sel.length < ROOMS.length) params.set('rooms', sel.join(','));
  const from = document.getElementById(barId(ns, 'from')).value;
  const to = document.getElementById(barId(ns, 'to')).value;
  if (from) params.set('from', from);
  if (to) params.set('to', to);
  const q = params.toString();
  return q ? '?' + q : '';
}

function applyFilters() {
  if (COMPARE_MODE) loadCompare(currentQuery(''), currentQuery('b'));
  else loadReport(currentQuery(''));
}

function resetFilters() {
  selectRooms('', true);
  document.getElementById(barId('', 'from')).value = '';
  document.getElementById(barId('', 'to')).value = '';
  if (COMPARE_MODE) {
    selectRooms('b', true);
    document.getElementById(barId('b', 'from')).value = '';
    document.getElementById(barId('b', 'to')).value = '';
    loadCompare('', '');
  } else {
    loadReport('');
  }
}

// Warn when a slice is too thin to say much, rather than letting the user
// discover a wall of "neh".
function sampleWarning(meta) {
  const el = document.getElementById('lk-warn');
  const perPos = meta.hands / 6;
  const msgs = [];
  if (meta.hands === 0) {
    msgs.push('No hands match this filter.');
  } else if (perPos < 60) {
    msgs.push(`This slice is thin — ${meta.hands.toLocaleString()} hands (~${Math.round(perPos)} per position). ` +
              `Most stats will show <b>neh</b>; widen the filter for firmer verdicts.`);
  }
  if (meta.tournaments_pending) {
    msgs.push(`${meta.tournaments_pending} tournament(s) still being summarised — reload to include them.`);
  }
  el.innerHTML = msgs.join('<br>');
  el.classList.toggle('d-none', msgs.length === 0);
}

// Verdict counts for one position's rows, derived through tierOf() so they
// track the Confidence level rather than the server's raw result strings.
function posCounts(rows) {
  const tiers = rows.filter(s => !isNA(s)).map(tierOf);
  return {
    good: tiers.filter(t => t === 'good').length,
    bad:  tiers.filter(t => t && t !== 'good' && t !== 'neh').length,
    thin: tiers.filter(t => t === 'neh').length,
  };
}

function applyMetaLevels(meta) {
  if (meta && meta.confidence_levels) Object.assign(CONFIDENCE, meta.confidence_levels);
  MIN_SAMPLE = CONFIDENCE[CONF_LEVEL] || (meta && meta.min_sample) || MIN_SAMPLE;
  if (meta && meta.bands) BAND_META = meta.bands;
  // The server clamps an unknown/empty band back to 'all'; keep the UI in sync
  // so a stale persisted band doesn't leave a phantom-active step.
  if (meta && meta.band) BAND = meta.band;
}

function confidenceControlHtml() {
  const steps = CONF_ORDER.map(lv =>
    `<span class="lk-conf-step${lv === CONF_LEVEL ? ' active' : ''}" ` +
    `data-level="${lv}" ` +
    `onclick="onConfidenceChange('${lv}')" ` +
    `title="Colour a verdict only once a stat has ${CONFIDENCE[lv]}+ opportunities">` +
    `${lv === 'med' ? 'Med' : lv[0].toUpperCase() + lv.slice(1)}</span>`).join('');
  return `<span class="lk-conf lk-status-right" onclick="event.stopPropagation()">` +
         `<span class="lk-conf-lbl" title="How many opportunities a stat needs before its verdict is coloured instead of shown as neh">Confidence</span>` +
         `<span class="lk-conf-track">${steps}</span></span>`;
}

// Depth selector: Blended + one step per stack band, each showing its hand
// count. A band with no hands is disabled (nothing to show). Mirrors the
// Confidence control's segmented look via the shared .lk-conf-* classes.
function depthControlHtml() {
  if (!BAND_META.length) return '';
  const steps = [{ key: 'all', label: 'All', hands: null }]
    .concat(BAND_META.map(b => ({ key: b.key, label: b.label, hands: b.hands })));
  const html = steps.map(s => {
    const empty = s.hands === 0;
    const active = s.key === BAND ? ' active' : '';
    const cnt = s.hands == null ? '' : ` (${s.hands.toLocaleString()})`;
    const click = empty ? '' : `onclick="onDepthChange('${s.key}')"`;
    const style = empty ? 'style="opacity:.35;cursor:not-allowed"' : '';
    return `<span class="lk-conf-step${active}" ${click} ${style} ` +
           `title="Effective stack depth${cnt ? ' — ' + s.hands.toLocaleString() + ' hands' : ''}">` +
           `${s.label}</span>`;
  }).join('');
  return `<span class="lk-conf" onclick="event.stopPropagation()">` +
         `<span class="lk-conf-lbl" title="Slice the report by hero's effective stack depth (min of hero and the deepest opponent)">Depth</span>` +
         `<span class="lk-conf-track">${html}</span></span>`;
}

// A depth change re-slices server-side, so unlike Confidence it re-fetches
// (respecting the current filters and compare mode).
function onDepthChange(band) {
  if (band === BAND) return;
  BAND = band;
  try { localStorage.setItem('lk_band', band); } catch (_) {}
  if (COMPARE_MODE) loadCompare(currentQuery(''), currentQuery('b'));
  else loadReport(currentQuery(''));
}

// Re-grade in place: swapping the level changes which rows read 'neh' and the
// OK/Not OK tallies, but must not disturb sort order, the per-position filter
// pills, or which panels the user has expanded — so no full re-render.
function onConfidenceChange(level) {
  if (!CONF_ORDER.includes(level) || level === CONF_LEVEL) return;
  CONF_LEVEL = level;
  MIN_SAMPLE = CONFIDENCE[level];
  try { localStorage.setItem('lk_confidence', level); } catch (_) {}
  // Scope to the Confidence control's own segments: the Depth selector shares
  // the .lk-conf-step class, so an unscoped select would also toggle its
  // highlight. Match by data-level, not index, so the two controls never
  // interfere regardless of render order.
  document.querySelectorAll('.lk-conf-step[data-level]').forEach(el => {
    el.classList.toggle('active', el.dataset.level === level);
  });
  const nehPill = document.getElementById('lk-neh-pill');
  if (nehPill) nehPill.title = nehTitle();
  const data = COMPARE_MODE ? COMPARE_DATA : REPORT_DATA;
  if (!data) return;
  const renderer = COMPARE_MODE ? renderRowsCompare : renderRows;
  Object.keys(data).forEach(pos => {
    const tbody = document.querySelector(`tbody[data-position="${pos}"]`);
    if (tbody) tbody.innerHTML = renderer(pos);
  });
  if (!COMPARE_MODE) refreshPosPillCounts();
}

// "All" counts what is actually on screen, so it drops the neh rows while
// they are hidden — that is what makes the pill's own toggle legible.
function allCount(good, bad, thin) {
  return good + bad + (HIDE_NEH ? 0 : thin);
}

function refreshPosPillCounts() {
  if (!REPORT_DATA) return;
  Object.keys(REPORT_DATA).forEach(pos => {
    const card = document.querySelector(`[data-pos-card="${pos}"]`);
    if (!card) return;
    const c = posCounts(REPORT_DATA[pos]);
    const all = card.querySelector('.lk-pill.all');
    const ok  = card.querySelector('.lk-pill.good');
    const bad = card.querySelector('.lk-pill.bad');
    if (all) {
      all.textContent = `All (${allCount(c.good, c.bad, c.thin)})`;
      all.classList.toggle('inactive', HIDE_NEH);
    }
    if (ok)  ok.textContent  = `OK (${c.good})`;
    if (bad) bad.textContent = `Not OK (${c.bad})`;
  });
}

function nehTitle() {
  return `Stats with fewer than ${MIN_SAMPLE} opportunities — not enough hands for a verdict`;
}

function nehPillHtml() {
  return `<span class="lk-pill thin lk-neh-toggle${HIDE_NEH ? '' : ' inactive'}" id="lk-neh-pill" ` +
         `onclick="onHideNehToggle()" style="cursor:pointer;user-select:none" ` +
         `title="${nehTitle()}">${HIDE_NEH ? 'Show neh' : 'Hide neh'}</span>`;
}

// Matches the tournament-summary strip on the main page (.val-pill in
// static/style.css): bold value, muted label.
function valPill(value, label, help) {
  return `<span class="val-pill" title="${esc(help)}">` +
         `<strong>${value}</strong><span class="val-pill-label">${label}</span></span>`;
}

function winratePill(v, label, help) {
  const cls = v == null ? '' : v >= 0 ? ' val-pos' : ' val-neg';
  const val = v == null ? '—' : `${fmtBB(v)}/100`;
  return `<span class="val-pill${cls}" title="${esc(help)}">` +
         `<strong>${val}</strong><span class="val-pill-label">${label}</span></span>`;
}

function renderReport(data) {
  applyMetaLevels(data.meta);

  if (data.filters) {
    LAST_FILTERS = data.filters;
    ensureFilterBar('');
    document.getElementById('lk-filterbar').classList.remove('d-none');
  }
  sampleWarning(data.meta);

  document.getElementById('lk-status').innerHTML =
    `<div class="lk-status-row">` +
    valPill(data.meta.hands.toLocaleString(), 'Hands',
            'Hands in the current filter') +
    valPill(data.meta.tournaments, 'Tourneys',
            'Tournaments in the current filter') +
    winratePill(data.meta.winrate_bb100, 'Overall',
                'All-in adjusted big blinds won per 100 hands') +
    winratePill(data.meta.winrate_raw_bb100, 'Raw',
                'Realised result before all-in equity adjustment') +
    depthControlHtml() +
    confidenceControlHtml() +
    nehPillHtml() +
    `</div>`;

  const excludedNotes = [];
  if (data.meta.hands_skipped) {
    excludedNotes.push(`${data.meta.hands_skipped} hands excluded (pot inconsistencies)`);
  }
  if (data.meta.hands_unadjusted) {
    excludedNotes.push(`<span style="color:#e0b95c">${data.meta.hands_unadjusted} all-in hands not yet equity-adjusted — reload to finish</span>`);
  }
  const exEl = document.getElementById('lk-excluded');
  if (excludedNotes.length) {
    exEl.innerHTML = '* ' + excludedNotes.join(' · ');
    exEl.classList.remove('d-none');
  } else {
    exEl.classList.add('d-none');
  }

  REPORT_DATA = {};
  const byPos = Object.fromEntries(data.positions.map(p => [p.position, p]));
  document.getElementById('lk-cards').innerHTML = POS_ORDER.map(posName => {
    const p = byPos[posName];
    if (!p) return '';
    REPORT_DATA[posName] = p.stats;
    SORT_STATE[posName] = null;
    SORT_HANDS_STATE[posName] = null;
    POS_FILTERS[posName] = defaultPosFilter();
    const { good, bad, thin } = posCounts(p.stats);
    return `
    <div class="section-card mb-3 lk-pos-card" data-pos-card="${p.position}" onclick="this.querySelector('.lk-body').classList.toggle('d-none')">
      <div class="lk-pos-head">
        <span class="lk-caret">▸</span>
        <span class="lk-pos-name">${p.position}</span>
        <span class="lk-pos-kv" title="All-in adjusted big blinds won per 100 hands">Winrate:
          <b class="${p.winrate_bb100 >= 0 ? 'lk-wr-pos' : 'lk-wr-neg'}">${fmtBB(p.winrate_bb100)}</b></span>
        <span class="lk-pos-kv">Hands: <b>${p.hands}</b></span>
        <div class="lk-pills" onclick="event.stopPropagation()">
          <span class="lk-pill all lk-filter-pill${HIDE_NEH ? ' inactive' : ''}" onclick="onHideNehToggle()"
                title="Show or hide neh stats — counts every position at once">All (${allCount(good, bad, thin)})</span>
          <span class="lk-pill good" onclick="togglePosFilter('${p.position}','good',event)">OK (${good})</span>
          <span class="lk-pill bad" onclick="togglePosFilter('${p.position}','bad',event)">Not OK (${bad})</span>
        </div>
      </div>
      <div class="lk-body d-none" onclick="event.stopPropagation()">
        <div class="table-responsive">
          <table class="table table-dark table-striped mb-0 lk-table">
            <thead><tr>${headerCells(p.position)}</tr></thead>
            <tbody data-position="${p.position}">${renderRows(p.position)}</tbody>
          </table>
        </div>
      </div>
    </div>`;
  }).join('');
}

// Fold the global depth band into any query (from currentQuery() or a bare
// '') so it rides along on the initial load, resets, and both compare ranges
// without every call site having to remember it.
function withBand(query) {
  if (!BAND || BAND === 'all') return query || '';
  return (query && query.length) ? query + '&band=' + BAND : '?band=' + BAND;
}

async function fetchLeaks(query) {
  const token = await AUTH_USER.getIdToken();
  const res = await fetch('/api/leaks' + withBand(query),
                          { headers: { 'Authorization': 'Bearer ' + token } });
  const body = await res.text();
  let data;
  // A proxy timeout or a crash upstream of Flask answers HTML, not JSON.
  try { data = JSON.parse(body); }
  catch (_) { throw new Error('Server error ' + res.status + ' — ' +
                              body.replace(/<[^>]*>/g, ' ').trim().slice(0, 200)); }
  if (data.error) throw new Error(data.error);
  return data;
}

async function loadReport(query) {
  const statusEl = document.getElementById('lk-status');
  const errEl = document.getElementById('lk-error');
  if (!AUTH_USER) return;
  errEl.classList.add('d-none');
  statusEl.textContent = 'Crunching your saved tournaments…';
  try {
    renderReport(await fetchLeaks(query));
  } catch (e) {
    statusEl.textContent = '';
    errEl.textContent = e.message;
    errEl.classList.remove('d-none');
  }
}

// ── Compare mode ─────────────────────────────────────────────────────────────
// Two ordinary /api/leaks reports, fetched with independent filters and
// zipped client-side. The engine and endpoint don't know "compare" exists —
// each response already carries everything a single stat row needs (pct,
// opp, result, delta), so combining two of them is pure presentation logic.

// A move smaller than this (in target-band widths) reads as noise, not progress.
const PROGRESS_EPS = 0.15;

function tierPairOf(row) {
  return [
    tierOf({ result: row.resultA, delta: row.deltaA, opp: row.oppA }),
    tierOf({ result: row.resultB, delta: row.deltaB, opp: row.oppB }),
  ];
}

// {kind: 'none'|'neh'|'improved'|'same'|'flipped'|'regressed', tA, tB, diff, crossed}
// 'none' — no target, or zero opportunities on a side (tierOf returns null).
// 'neh'  — a side has some opportunities but under MIN_SAMPLE.
// diff > 0 means the hand moved closer to the target band between A and B.
//
// `crossed` marks the case delta's magnitude alone cannot see: B sits on the
// OPPOSITE side of the target band from A (below the floor in one range, above
// the ceiling in the other). Distance is symmetric, so overshooting from 1.2
// band-widths under to 1.2 over nets diff = 0 and would otherwise be reported
// as "same" / "No change" — when in fact the player reversed the leak and the
// advice must now point the other way.
function progressOf(row) {
  const [tA, tB] = tierPairOf(row);
  if (tA === null || tB === null) return { kind: 'none' };
  if (tA === 'neh' || tB === 'neh') return { kind: 'neh', tA, tB };
  const dA = Math.abs(row.deltaA ?? 0), dB = Math.abs(row.deltaB ?? 0);
  const diff = dA - dB;
  // Sign of delta is the side of the band: <0 under the floor, >0 over the
  // ceiling, 0 inside it. Two non-zero opposite signs means B crossed over.
  const sA = Math.sign(row.deltaA ?? 0), sB = Math.sign(row.deltaB ?? 0);
  const crossed = sA !== 0 && sB !== 0 && sA !== sB;
  let kind = diff > PROGRESS_EPS ? 'improved' : diff < -PROGRESS_EPS ? 'regressed' : 'same';
  if (crossed && kind === 'same') kind = 'flipped';
  return { kind, tA, tB, diff, crossed };
}

function progressBadge(row) {
  const p = progressOf(row);
  if (p.kind === 'none') return '<span class="lk-count">—</span>';
  if (p.kind === 'neh') {
    return `<span class="lk-badge neh" title="Not enough hands on one side — ${row.oppA} vs ${row.oppB} opportunities">neh</span>`;
  }
  const meta = {
    improved: { label: 'improved',  color: TIERS.good.color },
    same:     { label: 'same',      color: TIERS.mid.color },
    flipped:  { label: 'flipped',   color: TIERS.mid.color },
    regressed:{ label: 'regressed', color: TIERS.high.color },
  }[p.kind];
  const title = `${p.tA} → ${p.tB} (${p.diff >= 0 ? '+' : ''}${p.diff.toFixed(2)} band-widths)`
    + (p.crossed ? ' — crossed to the other side of the target' : '');
  return `<span class="lk-badge" style="background:${meta.color}1f;color:${meta.color};border:1px solid ${meta.color}66" title="${esc(title)}">${meta.label}</span>`;
}

function recActionCompare(row) {
  const p = progressOf(row);
  if (p.kind === 'none') return row.oppA || row.oppB ? 'No target yet' : '';
  if (p.kind === 'neh') return `Need ${MIN_SAMPLE}+ hands on both sides`;
  if (p.tB === 'good') return p.tA === 'good' ? 'Still good' : 'Fixed — now inside target';
  // The harvested rec text for a handful of cells is literally "Good job" —
  // written for when that stat's verdict IS good. We only reach here when
  // it's not (the tB === 'good' branch above already returned), so that text
  // would be nonsensical; fall back to the generic more/less direction instead.
  //
  // directedRec() flips the stored "more"/"less" wording to match the side B
  // actually landed on. Using row.rec verbatim (as this did) meant a stat that
  // crossed the band kept the advice written for the OTHER side — telling the
  // player to do more of exactly what they were now overdoing.
  const staticRec = (row.rec && row.rec !== 'Good job')
    ? directedRec(row.rec, row.resultB)
    : (row.resultB === 'LOW' ? 'More' : row.resultB === 'HIGH' ? 'Less' : '');
  if (p.crossed) {
    const side = row.resultB === 'LOW' ? 'too low' : 'too high';
    if (p.kind === 'improved')  return `Overshot the target but closer — now ${side}; ${staticRec}`;
    if (p.kind === 'regressed') return `Overcorrected past the target, further out — ${staticRec}`;
    return `Overcorrected — ${side} now instead; ${staticRec}`;
  }
  if (p.kind === 'improved') return `Better, keep pushing — ${staticRec}`;
  if (p.kind === 'regressed') return `Getting worse — ${staticRec}`;
  return staticRec || 'No change';
}

function recColorCompare(row) {
  const p = progressOf(row);
  // A crossing is never a clean win, however much the magnitude shrank — the
  // leak reversed rather than closed, so it reads amber either way. (crossed
  // implies B is outside the band, so this can't swallow a 'good' verdict.)
  if (p.crossed) return TIERS.mid.color;
  if (p.kind === 'improved') return TIERS.good.color;
  if (p.kind === 'regressed') return TIERS.high.color;
  if (p.kind === 'same') return p.tB === 'good' ? TIERS.good.color : TIERS.mid.color;
  return '';
}

// Mirrors rankOf()/sortedRows(): improved(0) same(1) flipped(2) regressed(3),
// then the "nothing to say" tail — neh(4), no target/no samples(5/6) — pinned
// last in BOTH sort directions. 'flipped' ranks below 'same' because reversing
// a leak is worse than holding steady, but above an outright regression.
const PROGRESS_TAIL_RANK = 4;

function rankOfProgress(row) {
  const p = progressOf(row);
  if (p.kind === 'improved')  return 0;
  if (p.kind === 'same')      return 1;
  if (p.kind === 'flipped')   return 2;
  if (p.kind === 'regressed') return 3;
  if (p.kind === 'neh')       return PROGRESS_TAIL_RANK;
  return (row.oppA || row.oppB) ? 5 : 6;
}

function sortedRowsCompare(rows, dir) {
  if (!dir) return rows;
  return rows.slice().sort((a, b) => {
    const ra = rankOfProgress(a), rb = rankOfProgress(b);
    const tailA = ra >= PROGRESS_TAIL_RANK, tailB = rb >= PROGRESS_TAIL_RANK;
    if (tailA !== tailB) return tailA ? 1 : -1;
    if (tailA) return ra - rb;
    if (ra !== rb) return dir === 'asc' ? ra - rb : rb - ra;
    const da = -(progressOf(a).diff ?? 0), db = -(progressOf(b).diff ?? 0);
    return dir === 'asc' ? da - db : db - da;
  });
}

function cmpHeroColor(result) {
  if (result === 'GOOD') return TIERS.good.color;
  if (result === 'LOW') return TIERS.low.color;
  if (result === 'HIGH') return TIERS.high.color;
  return '';
}

function rowHtmlCompare(row, showStreet) {
  const help = STAT_HELP[row.label] || '';
  const isNA = row.target === null && row.rec === 'Not applicable';
  const targetCell = isNA ? '<span class="lk-count">n/a</span>'
    : row.target ? row.target[0] + '% – ' + row.target[1] + '%' : '—';
  const rc = isNA ? '' : recColorCompare(row);
  const recStyle = rc ? ` style="color:${rc}"` : '';
  const recClass = rc ? '' : 'lk-rec-thin';
  const hcA = cmpHeroColor(row.resultA), hcB = cmpHeroColor(row.resultB);
  const cells = [
    `<td data-col="0"><span class="lk-stat-name" data-tip="${esc(help)}">${row.label}</span> <span class="lk-count">(${row.oppA}/${row.oppB})</span>${showStreet ? ` <span class="lk-street-inline">${row.street}</span>` : ''}</td>`,
    `<td data-col="1" class="text-end"${hcA ? ` style="color:${hcA}"` : ''}>${fmtPct(row.pctA)}</td>`,
    `<td data-col="2" class="text-end"${hcB ? ` style="color:${hcB}"` : ''}>${fmtPct(row.pctB)}</td>`,
    `<td data-col="3" class="text-end">${targetCell}</td>`,
    `<td data-col="4" class="text-center">${isNA ? '<span class="lk-count">—</span>' : progressBadge(row)}</td>`,
    `<td data-col="5" class="${recClass}"${recStyle}>${isNA ? 'Not applicable' : recActionCompare(row)}</td>`,
  ];
  return `<tr>${COL_ORDER_CMP.map(i => cells[i]).join('')}</tr>`;
}

function renderRowsCompare(position) {
  const dir = SORT_STATE[position];
  const hdir = SORT_HANDS_STATE[position];
  let rows = COMPARE_DATA[position].filter(s => !(s.target === null && s.rec === 'Not applicable'));
  if (HIDE_NEH) rows = rows.filter(s => progressOf(s).kind !== 'neh');
  if (hdir) {
    const sorted = rows.slice().sort((a, b) => {
      const va = (a.oppA || 0) + (a.oppB || 0), vb = (b.oppA || 0) + (b.oppB || 0);
      return hdir === 'asc' ? va - vb : vb - va;
    });
    return sorted.map(s => rowHtmlCompare(s, true)).join('');
  }
  if (!dir) {
    return STREETS.map(street => {
      const group = rows.filter(s => s.street === street);
      if (!group.length) return '';
      return `<tr class="lk-street-row"><td colspan="6">${street}</td></tr>`
        + group.map(s => rowHtmlCompare(s, false)).join('');
    }).join('');
  }
  return sortedRowsCompare(rows, dir).map(s => rowHtmlCompare(s, true)).join('');
}

function cycleSortCompare(position) {
  const cur = SORT_STATE[position];
  SORT_STATE[position] = cur === null ? 'asc' : cur === 'asc' ? 'desc' : null;
  document.querySelector(`tbody[data-position="${position}"]`).innerHTML = renderRowsCompare(position);
  const arrow = document.querySelector(`[data-sort-arrow="${position}"]`);
  if (arrow) arrow.textContent = sortArrow(position);
}

// Zips two /api/leaks responses into one row per (position, stat). Both list
// POSITION_BUCKETS/ALL_STATS in the same fixed server-side order, so matching
// by stat `key` (not index) keeps this correct even if that ever changes.
function buildPositionsCombined(dataA, dataB) {
  const byA = Object.fromEntries(dataA.positions.map(p => [p.position, p]));
  const byB = Object.fromEntries(dataB.positions.map(p => [p.position, p]));
  return POS_ORDER.map(pos => {
    const a = byA[pos], b = byB[pos];
    if (!a && !b) return null;
    const statsB = Object.fromEntries((b ? b.stats : []).map(s => [s.key, s]));
    const rows = (a ? a.stats : []).map(sa => {
      const sb = statsB[sa.key] || { pct: null, opp: 0, result: null, delta: null };
      return {
        key: sa.key, label: sa.label, street: sa.street, target: sa.target, rec: sa.rec,
        pctA: sa.pct, oppA: sa.opp, resultA: sa.result, deltaA: sa.delta,
        pctB: sb.pct, oppB: sb.opp, resultB: sb.result, deltaB: sb.delta,
      };
    });
    return {
      position: pos, rows,
      hands: { a: a ? a.hands : 0, b: b ? b.hands : 0 },
      winrate: { a: a ? a.winrate_bb100 : null, b: b ? b.winrate_bb100 : null },
    };
  }).filter(Boolean);
}

function renderCompareReport(dataA, dataB) {
  applyMetaLevels(dataA.meta);

  if (dataA.filters) {
    LAST_FILTERS = dataA.filters;
    ensureFilterBar('');
    document.getElementById('lk-filterbar').classList.remove('d-none');
  }

  document.getElementById('lk-status').innerHTML =
    `<div class="lk-status-row">` +
    `<span><b>A</b> ${dataA.meta.hands.toLocaleString()}h / ${dataA.meta.tournaments}t · ` +
    `${fmtBB(dataA.meta.winrate_bb100)}/100` +
    (dataA.meta.hands_skipped ? ` (${dataA.meta.hands_skipped} excluded)` : '') +
    `&nbsp;&nbsp;vs&nbsp;&nbsp;<b>B</b> ${dataB.meta.hands.toLocaleString()}h / ${dataB.meta.tournaments}t · ` +
    `${fmtBB(dataB.meta.winrate_bb100)}/100` +
    (dataB.meta.hands_skipped ? ` (${dataB.meta.hands_skipped} excluded)` : '') + `</span>` +
    depthControlHtml() +
    confidenceControlHtml() +
    nehPillHtml() +
    `</div>`;

  const warnEl = document.getElementById('lk-warn');
  const msgs = [];
  if (dataA.meta.hands === 0 || dataB.meta.hands === 0) {
    msgs.push('One of the two ranges has no matching hands — pick different filters to compare.');
  }
  if (dataA.meta.tournaments_pending || dataB.meta.tournaments_pending) {
    msgs.push('Some tournaments are still being summarised — reload to include them.');
  }
  warnEl.innerHTML = msgs.join('<br>');
  warnEl.classList.toggle('d-none', msgs.length === 0);

  COMPARE_DATA = {};
  const combined = buildPositionsCombined(dataA, dataB);
  document.getElementById('lk-cards').innerHTML = combined.map(p => {
    COMPARE_DATA[p.position] = p.rows;
    SORT_STATE[p.position] = null;
    SORT_HANDS_STATE[p.position] = null;
    return `
    <div class="section-card mb-3 lk-pos-card" onclick="this.querySelector('.lk-body').classList.toggle('d-none')">
      <div class="lk-pos-head">
        <span class="lk-caret">▸</span>
        <span class="lk-pos-name">${p.position}</span>
        <span class="lk-pos-kv" title="All-in adjusted big blinds won per 100 hands, A → B">Winrate:
          <b class="${p.winrate.a >= 0 ? 'lk-wr-pos' : 'lk-wr-neg'}">${fmtBB(p.winrate.a)}</b> →
          <b class="${p.winrate.b >= 0 ? 'lk-wr-pos' : 'lk-wr-neg'}">${fmtBB(p.winrate.b)}</b></span>
        <span class="lk-pos-kv">Hands: <b>${p.hands.a}</b> / <b>${p.hands.b}</b></span>
      </div>
      <div class="lk-body d-none" onclick="event.stopPropagation()">
        <div class="table-responsive">
          <table class="table table-dark table-striped mb-0 lk-table lk-table-cmp">
            <thead><tr>${headerCellsCmp(p.position)}</tr></thead>
            <tbody data-position="${p.position}">${renderRowsCompare(p.position)}</tbody>
          </table>
        </div>
      </div>
    </div>`;
  }).join('');
}

async function loadCompare(queryA, queryB) {
  const statusEl = document.getElementById('lk-status');
  const errEl = document.getElementById('lk-error');
  if (!AUTH_USER) return;
  errEl.classList.add('d-none');
  statusEl.textContent = 'Crunching both ranges…';
  try {
    const [dataA, dataB] = await Promise.all([fetchLeaks(queryA), fetchLeaks(queryB)]);
    renderCompareReport(dataA, dataB);
  } catch (e) {
    statusEl.textContent = '';
    errEl.textContent = e.message;
    errEl.classList.remove('d-none');
  }
}

(async () => {
  const statusEl = document.getElementById('lk-status');
  const errEl = document.getElementById('lk-error');
  try {
    const cfg = await (await fetch('/api/firebase-config')).json();
    if (cfg.error) throw new Error('Firebase not configured');
    firebase.initializeApp({
      apiKey: cfg.FIREBASE_API_KEY, authDomain: cfg.FIREBASE_AUTH_DOMAIN,
      projectId: cfg.FIREBASE_PROJECT_ID, appId: cfg.FIREBASE_APP_ID,
    });
    firebase.auth().onAuthStateChanged(async user => {
      if (!user) {
        statusEl.innerHTML = 'Please <a href="/">sign in on the main page</a> first, then come back.';
        return;
      }
      AUTH_USER = user;
      document.getElementById('lk-authbar').innerHTML =
        `<span class="auth-chip">` +
        `<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>` +
        `<span class="auth-email"></span></span>`;
      // textContent, not innerHTML — the email is user-controlled.
      document.querySelector('#lk-authbar .auth-email').textContent = user.email || user.uid;
      loadReport('');
    });
  } catch (e) {
    statusEl.textContent = '';
    errEl.textContent = e.message;
    errEl.classList.remove('d-none');
  }
})();
</script>
